<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,minimal-ui,viewport-fit=cover"/>
  <title>Crypto Ticker 2 Settings</title>
  <link rel="stylesheet" href="../../libs/css/udpi.css">
  <style>
    .color-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .color-row input[type="color"] {
      width: 36px;
      height: 28px;
      padding: 0;
      border: 1px solid var(--udpi-bordercolor);
      border-radius: 4px;
      background: transparent;
      cursor: pointer;
      flex-shrink: 0;
    }
    .color-row input[type="color"]::-webkit-color-swatch-wrapper {
      padding: 2px;
    }
    .color-row input[type="color"]::-webkit-color-swatch {
      border: none;
      border-radius: 2px;
    }
    .color-row input[type="text"] {
      width: 80px;
      flex-shrink: 0;
    }
    .preset-colors {
      display: flex;
      gap: 4px;
      margin-top: 4px;
      flex-wrap: wrap;
    }
    .preset-color {
      width: 20px;
      height: 20px;
      border-radius: 3px;
      border: 1px solid #555;
      cursor: pointer;
    }
    .preset-color:hover {
      border-color: #fff;
    }
  </style>
</head>
<body>
  <div class="udpi-wrapper hidden">
    <form id="property-inspector">
      <input type="hidden" name="actionType" value="ticker2">

      <div class="udpi-item">
        <div class="udpi-item-label" data-localize>Symbol</div>
        <select class="udpi-item-value select" name="symbol">
          <option value="USD_KRW">&#xB2EC;&#xB7EC; (USD/KRW)</option>
          <option value="USDT_KRW">USDT (KRW)</option>
          <option value="BTC">BTC</option>
          <option value="ETH">ETH</option>
          <option value="SOL">SOL</option>
          <option value="BNB">BNB</option>
          <option value="XRP">XRP</option>
          <option value="DOGE">DOGE</option>
          <option value="ADA">ADA</option>
          <option value="AVAX">AVAX</option>
          <option value="DOT">DOT</option>
          <option value="MATIC">MATIC</option>
          <option value="LINK">LINK</option>
          <option value="UNI">UNI</option>
          <option value="ATOM">ATOM</option>
          <option value="ARB">ARB</option>
          <option value="OP">OP</option>
          <option value="APT">APT</option>
          <option value="SUI">SUI</option>
          <option value="PEPE">PEPE</option>
          <option value="WIF">WIF</option>
          <option value="NEAR">NEAR</option>
        </select>
      </div>

      <div class="udpi-item">
        <div class="udpi-item-label" data-localize>Background Color</div>
        <div class="udpi-item-value">
          <div class="color-row">
            <input type="color" id="bgColorPicker" value="#000000">
            <input type="text" class="udpi-item-value" id="bgColorText" name="bgColor" value="#000000" maxlength="7" placeholder="#000000">
          </div>
          <div class="preset-colors" id="bgPresets">
            <div class="preset-color" style="background:#000000" data-color="#000000" title="Black"></div>
            <div class="preset-color" style="background:#1a1a2e" data-color="#1a1a2e" title="Dark Navy"></div>
            <div class="preset-color" style="background:#0f172a" data-color="#0f172a" title="Slate 900"></div>
            <div class="preset-color" style="background:#1e293b" data-color="#1e293b" title="Slate 800"></div>
            <div class="preset-color" style="background:#18181b" data-color="#18181b" title="Zinc 900"></div>
            <div class="preset-color" style="background:#111827" data-color="#111827" title="Gray 900"></div>
            <div class="preset-color" style="background:#0c0a09" data-color="#0c0a09" title="Stone 950"></div>
            <div class="preset-color" style="background:#171717" data-color="#171717" title="Neutral 900"></div>
          </div>
        </div>
      </div>

      <div class="udpi-item">
        <div class="udpi-item-label" data-localize>Symbol Size</div>
        <div class="udpi-item-value">
          <div class="color-row">
            <input type="range" id="symbolFontSizeRange" min="8" max="40" value="16" style="flex:1">
            <input type="number" class="udpi-item-value" id="symbolFontSizeNum" name="symbolFontSize" value="16" min="8" max="40" style="width:50px">
            <span style="color:#9a9a9a">px</span>
          </div>
        </div>
      </div>

      <div class="udpi-item">
        <div class="udpi-item-label" data-localize>Price Size</div>
        <div class="udpi-item-value">
          <div class="color-row">
            <input type="range" id="priceFontSizeRange" min="12" max="60" value="32" style="flex:1">
            <input type="number" class="udpi-item-value" id="priceFontSizeNum" name="priceFontSize" value="32" min="12" max="60" style="width:50px">
            <span style="color:#9a9a9a">px</span>
          </div>
        </div>
      </div>

      <div class="udpi-item">
        <div class="udpi-item-label" data-localize>Change Size</div>
        <div class="udpi-item-value">
          <div class="color-row">
            <input type="range" id="changeFontSizeRange" min="8" max="40" value="14" style="flex:1">
            <input type="number" class="udpi-item-value" id="changeFontSizeNum" name="changeFontSize" value="14" min="8" max="40" style="width:50px">
            <span style="color:#9a9a9a">px</span>
          </div>
        </div>
      </div>

      <div class="udpi-item">
        <div class="udpi-item-label" data-localize>Line Gap</div>
        <div class="udpi-item-value">
          <div class="color-row">
            <input type="range" id="lineGapRange" min="-10" max="30" value="8" style="flex:1">
            <input type="number" class="udpi-item-value" id="lineGapNum" name="lineGap" value="8" min="-10" max="30" style="width:50px">
            <span style="color:#9a9a9a">px</span>
          </div>
        </div>
      </div>

      <div class="udpi-item" type="checkbox">
        <div class="udpi-item-label" data-localize>Show Change %</div>
        <div class="udpi-item-value">
          <input type="checkbox" id="showChangeToggle" name="showChange" value="on" checked>
          <label for="showChangeToggle"><span></span></label>
        </div>
      </div>

      <div class="udpi-item">
        <div class="udpi-item-label" data-localize>Text Offset Y</div>
        <div class="udpi-item-value">
          <div class="color-row">
            <input type="range" id="textOffsetYRange" min="-80" max="80" value="0" style="flex:1">
            <input type="number" class="udpi-item-value" id="textOffsetYNum" name="textOffsetY" value="0" min="-80" max="80" style="width:50px">
            <span style="color:#9a9a9a">px</span>
          </div>
        </div>
      </div>

      <div class="udpi-item">
        <div class="udpi-item-label" data-localize>Font</div>
        <select id="fontSelect" name="customFont" class="udpi-item-value select"></select>
      </div>
      <div class="udpi-item">
        <div class="udpi-item-label"></div>
        <div class="udpi-item-value">
          <div id="fontPreview" style="padding:8px; background:#000; border-radius:4px; text-align:center; display:none;">
            <div id="fontPreviewText" style="color:#fff; font-size:24px;">BTC $83,421</div>
          </div>
        </div>
      </div>

      <div class="udpi-item">
        <div class="udpi-item-label" data-localize>Refresh Frequency</div>
        <select class="udpi-item-value select" name="refreshDuration">
          <option value="5" data-localize>5s</option>
          <option value="10" data-localize>10s</option>
          <option value="30" data-localize selected>30s</option>
          <option value="60" data-localize>1min</option>
          <option value="300" data-localize>5min</option>
          <option value="900" data-localize>15min</option>
        </select>
      </div>

      <div class="udpi-item" style="margin-top:8px; border-top:1px solid var(--udpi-bordercolor); padding-top:8px;">
        <div class="udpi-item-label" style="font-weight:bold; color:var(--udpi-fontcolor)">Alert</div>
        <div class="udpi-item-value"></div>
      </div>

      <div class="udpi-item" type="checkbox">
        <div class="udpi-item-label" data-localize>Under Target Price</div>
        <div class="udpi-item-value" style="display:flex; align-items:center; gap:8px;">
          <input type="checkbox" id="alertUnderToggle" name="alertUnderEnabled" value="on">
          <label for="alertUnderToggle"><span></span></label>
          <span style="color:#9a9a9a; font-size:12px;">$</span>
          <input type="number" class="udpi-item-value" id="alertUnderPriceInput" name="alertUnderPrice" value="0" min="0" step="0.01" style="width:70px;">
        </div>
      </div>

      <div class="udpi-item" type="checkbox">
        <div class="udpi-item-label" data-localize>Over Target Price</div>
        <div class="udpi-item-value" style="display:flex; align-items:center; gap:8px;">
          <input type="checkbox" id="alertOverToggle" name="alertOverEnabled" value="on">
          <label for="alertOverToggle"><span></span></label>
          <span style="color:#9a9a9a; font-size:12px;">$</span>
          <input type="number" class="udpi-item-value" id="alertOverPriceInput" name="alertOverPrice" value="0" min="0" step="0.01" style="width:70px;">
        </div>
      </div>

    </form>
  </div>

  <script src="../../libs/js/constants.js"></script>
  <script src="../../libs/js/eventEmitter.js"></script>
  <script src="../../libs/js/timers.js"></script>
  <script src="../../libs/js/utils.js"></script>
  <script src="../../libs/js/ulanzideckApi.js"></script>
  <script src="./inspector.js"></script>
</body>
</html>
